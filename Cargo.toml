[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
digcord-gateway = { path = "crates/digcord-gateway" }
digcord-http = { path = "crates/digcord-http" }
digcord-model = { path = "crates/digcord-model" }
digcord-store = { path = "crates/digcord-store" }
digcord-tui = { path = "crates/digcord-tui" }

[package]
name = "digcord"
description = "Rust ile yazılmış Discord TUI istemcisi."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
digcord-gateway.workspace = true
digcord-http.workspace = true
digcord-store.workspace = true
digcord-model.workspace = true
digcord-tui.workspace = true
dirs = "7.0.0"
jiff = "0.2.41"
keyring-core = "1.0.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
notify-rust = "4.17.0"
toml = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
