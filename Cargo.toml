[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
digcord-tui = { path = "crates/digcord-tui" }

[package]
name = "digcord"
description = "Rust ile yazılmış Discord TUI istemcisi."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
digcord-tui.workspace = true
