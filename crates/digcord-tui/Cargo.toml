[package]
name = "digcord-tui"
description = "ratatui arayüzü, girdi ve kısayollar."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
digcord-media.workspace = true
digcord-model.workspace = true
digcord-store.workspace = true
emojis = "0.9.1"
jiff = "0.2.41"
ratatui = "0.30"
# Terminal grafik protokolleri (kitty/sixel/iTerm2) + yarım blok yedeği; MIT. Varsayılan
# özellikler kapalı: `chafa-dyn` LGPL bir C kütüphanesine bağlanır.
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
tracing = "0.1.44"
unicode-width = "0.2.0"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
insta = "1.49.0"
serde_json = "1.0.154"
