[package]
name = "digcord-voice"
description = "Ses gateway'i, UDP, RTP, Opus ve DAVE (MLS) şifreleme."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11.1"
chacha20poly1305 = "0.11.0"
hmac = "0.12"
openmls = "0.9.2"
openmls_basic_credential = "0.6"
openmls_rust_crypto = "0.6"
openmls_traits = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.10"
subtle = "2.6.1"
thiserror = "2.0.21"
tls_codec = "0.5.0"
# Ağ: ana gateway ile aynı sürümler.
fastrand = "2.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
