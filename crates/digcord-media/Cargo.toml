[package]
name = "digcord-media"
description = "CDN indirme, resim çözme/ölçekleme, disk önbelleği."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
# Resim çözme: sadece Discord'un sunduğu biçimler (varsayılan özellikler tüm biçimleri çeker).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# digcord-http ile aynı sürüm/TLS ayarı; sıkıştırma gereksiz (resimler zaten sıkışık).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "fs"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util"] }
