[package]
name = "digcord-gateway"
description = "WebSocket gateway: identify, heartbeat, resume, zlib-stream."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
digcord-model.workspace = true
fastrand = "2.5.0"
flate2 = "1.1.11"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "net", "test-util"] }
